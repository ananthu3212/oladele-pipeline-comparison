# OladeleO DevSecOps Pipeline — adapted for flask-webgoat
# Source: github.com/OladeleO/pygoat, branch free-devsecops-pipeline
# Fix applied: actions/upload-artifact updated v3→v4 (v3 deprecated April 2024)
# All tool versions, flags, and configurations are otherwise identical to original.

name: OladeleO Pipeline Comparison (flask-webgoat)

on:
  workflow_dispatch:

jobs:

  sca_safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies and Safety
        run: |
          pip install safety
          if [ ! -f "requirements.txt" ]; then
            echo "Error: requirements.txt not found!" && exit 1
          fi
          pip install -r requirements.txt

      - name: Run Safety (SCA)
        run: |
          safety check --file=requirements.txt --json \
            > safety-report.json \
            || echo "Safety scan completed with issues"

      - name: Upload Safety Report
        uses: actions/upload-artifact@v4
        with:
          name: safety-sca-report
          path: safety-report.json

  sast_bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit (SAST)
        run: |
          bandit -r . -ll -iii -f html -o bandit-report.html \
            || echo "Bandit scan completed with issues"

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-sast-html-report
          path: bandit-report.html

  secrets_detection:
    name: Run Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  dast_scan:
    runs-on: ubuntu-latest
    needs: [sca_safety, sast_bandit, secrets_detection]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install flask-webgoat dependencies
        run: pip install -r requirements.txt

      - name: Start flask-webgoat
        run: |
          python run.py &
          sleep 10
          curl -f http://localhost:5000 \
            || (echo "flask-webgoat failed to start" && exit 1)

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000"
          cmd_options: '-a'
          artifact_name: zap_scan
          allow_issue_writing: false